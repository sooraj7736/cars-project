<div class="card premium-card w-100 h-100 border-0 shadow-sm">

  <div class="position-relative overflow-hidden">
    <img [src]="cars.image" class="card-img-top premium-img" alt="{{ cars.name }}">
    <span class="badge bg-dark position-absolute top-0 end-0 m-2 px-3 py-2">
      ₹ {{ cars.price }}
    </span>
  </div>

  <div class="card-body d-flex flex-column">
    <h5 class="card-title fw-bold">{{ cars.name }}</h5>
    <p class="text-muted small mb-2">{{ cars.year }} • {{ cars.fuel_type }} • {{ cars.transmission }}</p>
    <p class="card-text small flex-grow-1 text-secondary">{{ cars.description }}</p>
    <button [routerLink]="['/cars/car-details', cars.id]" class="btn btn-dark w-100 mt-3">View Details</button>
  </div>

</div>
