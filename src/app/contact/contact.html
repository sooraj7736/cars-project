<section class="contact-section py-5">
    <div class="container">

       
        <div class="text-center mb-5">
            <h2 class="fw-bold">Get in Touch</h2>
            <p class="text-muted">Have questions or want to buy/sell a car? We're here to help.</p>
            <div class="divider mx-auto"></div>
        </div>

        <div class="row g-5">

            <div class="col-lg-7">
                <div class="contact-form p-4 p-md-5 shadow-lg">

                    <form>

                        <div class="mb-4">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control custom-input" placeholder="Enter your name" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control custom-input" placeholder="Enter your email"
                                    required>
                            </div>

                            <div class="col-md-6 mb-4">
                                <label class="form-label">Phone</label>
                                <input type="tel" class="form-control custom-input"
                                    placeholder="Enter your phone number">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Purpose</label>
                            <select class="form-select custom-input">
                                <option selected disabled>Select purpose</option>
                                <option>Buy a Car</option>
                                <option>Sell My Car</option>
                                <option>Book Test Drive</option>
                                <option>General Inquiry</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Message</label>
                            <textarea class="form-control custom-input" rows="4" placeholder="Write your message..."
                                required></textarea>
                        </div>

                        <button class="btn btn-warning w-100 fw-bold btn-lg">
                            Send Inquiry
                        </button>

                    </form>
                </div>
            </div>

           
            <div class="col-lg-5">
                <div class="contact-info text-white p-4 p-md-5 h-100 shadow-lg">

                    <h5 class="fw-bold mb-4">Contact Information</h5>

                    <div class="info-item">
                        <i class="bi bi-geo-alt-fill"></i>
                        <span>Kochi, Kerala</span>
                    </div>

                    <div class="info-item">
                        <i class="bi bi-telephone-fill"></i>
                        <span>+91 98765 43210</span>
                    </div>

                    <div class="info-item mb-4">
                        <i class="bi bi-envelope-fill"></i>
                        <span>support@automart.com</span>
                    </div>

                    <h6 class="fw-bold">Working Hours</h6>
                    <p class="mb-1">Mon - Sat: 9:00 AM - 7:00 PM</p>
                    <p>Sunday: Closed</p>

                </div>
            </div>

        </div>

        
        <div class="mt-5 rounded overflow-hidden shadow">
            <iframe src="https://maps.google.com/maps?q=kochi&t=&z=13&ie=UTF8&iwloc=&output=embed" width="100%"
                height="350" style="border:0;" loading="lazy">
            </iframe>
        </div>

    </div>
</section>
