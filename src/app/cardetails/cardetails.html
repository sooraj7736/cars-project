<div class="container my-5">

    <div class="row g-5">

        <div class="col-md-6">
            <div class="card border-0 shadow-lg overflow-hidden">
                <img [src]="cars.image" class="img-fluid detail-img" alt="{{ cars.name }}">
            </div>
        </div>


        <div class="col-md-6">

            <h2 class="fw-bold mb-2">{{ cars.name }}</h2>

            <p class="text-muted mb-3">
                {{ cars.year }} • {{ cars.brand }}
            </p>


            <h3 class="text-success fw-bold mb-3">
                ₹ {{ cars.price }}
            </h3>

            <div class="mb-3">
                ⭐⭐⭐⭐☆ <span class="text-muted ms-2">4.5 Rating • Trusted Seller</span>
            </div>


            <p class="text-secondary mb-4">
                {{ cars.description }}
            </p>


            <div class="row g-3 mb-4">

                <div class="col-6">
                    <div class="spec-box">
                        <small>Fuel Type</small>
                        <p>{{ cars.fuel_type }}</p>
                    </div>
                </div>

                <div class="col-6">
                    <div class="spec-box">
                        <small>Transmission</small>
                        <p>{{ cars.transmission }}</p>
                    </div>
                </div>

                <div class="col-6">
                    <div class="spec-box">
                        <small>Kilometers</small>
                        <p>{{ cars.km_driven }} km</p>
                    </div>
                </div>

                <div class="col-6">
                    <div class="spec-box">
                        <small>Location</small>
                        <p>{{ cars.location }}</p>
                    </div>
                </div>

            </div>


            <div class="d-flex gap-3">

                <button class="btn btn-warning btn-lg flex-fill">
                    Contact Seller
                </button>

                <button class="btn btn-outline-dark btn-lg flex-fill">
                    Save
                </button>

            </div>

        </div>

    </div>

</div>
