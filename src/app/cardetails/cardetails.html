<div class="container mt-5">
    <div class="row">

        <div class="col-md-6 mb-4">
            <img [src]="cars.image" alt="Car Image" 
                class="img-fluid rounded mb-3" 
                style="height:350px; object-fit:cover; width:100%;">
        </div>

        <div class="col-md-6">
            <h2 class="mb-3">{{ cars.name }}</h2>

            <div class="mb-3">
                <span class="h4 text-success">₹ {{ cars.price }}</span>
            </div>

            <div class="mb-3 text-muted">
                 4.5 Rating • Trusted Seller
            </div>

            <p class="mb-4">{{ cars.description }}</p>

            <div class="mb-3">
                <strong>Brand:</strong> {{ cars.brand }}
            </div>

            <div class="mb-3">
                <strong>Year:</strong> {{ cars.year }}
            </div>

            <div class="mb-3">
                <strong>Fuel Type:</strong> {{ cars.fuel_type }}
            </div>

            <div class="mb-3">
                <strong>Transmission:</strong> {{ cars.transmission }}
            </div>

            <div class="mb-3">
                <strong>Kilometers Driven:</strong> {{ cars.km_driven }} km
            </div>

            <div class="mb-4">
                <strong>Location:</strong> {{ cars.location }}
            </div>

            <button class="btn btn-warning btn-lg mb-3 me-2">
                 Contact Seller
            </button>

            <button class="btn btn-outline-primary btn-lg mb-3">
                Save Car
            </button>

        </div>

    </div>
</div>
